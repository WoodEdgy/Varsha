name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK (installable immediately, for testing)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build release APK (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Build release AAB (for Play Store, unsigned)
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VARSHA-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: VARSHA-release-apk-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload release AAB (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: VARSHA-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
